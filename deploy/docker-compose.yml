# ============================================================================
# KunFlix - Docker Compose（单机生产部署 / 2C4G Ubuntu）
# ----------------------------------------------------------------------------
# 使用方式：
#   cd deploy
#   cp .env.prod.example .env.prod
#   docker compose --env-file .env.prod up -d --build
# ============================================================================

name: kunflix

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 —— 主数据库（全新初始化，直接选用当前 GA 版）
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: kunflix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      LANG: en_US.utf8
      # PG18+ 要求数据必须位于挂载点的子目录（配合 pg_upgrade --link）
      # 这里保持历史挂载路径，仅将数据放到 /var/lib/postgresql/data/pgdata 子目录
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [kunflix_net]

  # ---------------------------------------------------------------------------
  # Redis 7 —— 缓存 / Pub-Sub / SSE Stream / 限流
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kunflix-redis
    # 注：REDIS_PASSWORD 既要在编排期被 Compose 注入到 --requirepass，
    # 也必须以环境变量形式存在于容器内，否则 healthcheck 里的
    # `redis-cli -a $REDIS_PASSWORD` 在容器 shell 中展开为空，触发 NOAUTH
    # 导致容器始终 unhealthy（业务实际可用，但 update.sh 健康检查超时）。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    healthcheck:
      # 用单引号包裹 -a 的密码，避免特殊字符被容器 shell 二次解析
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [kunflix_net]

  # ---------------------------------------------------------------------------
  # Backend —— FastAPI + uvicorn
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: kunflix-backend
    env_file:
      - .env.prod
    environment:
      # 运行时从 compose env 注入 / 覆盖，保证与 postgres/redis 服务名一致
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_BACKEND: redis
      QUEUE_BACKEND: arq
      QUEUE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      STORAGE_BACKEND: local
      STORAGE_LOCAL_BASE_DIR: /app/media
      RUN_MIGRATIONS: "true"
      RATE_LIMIT_ENABLED: "true"
      CIRCUIT_BREAKER_ENABLED: "true"
      AUDIT_ENABLED: "true"
      # 生产通过 Nginx 单域名同源访问，保留内部直连来源以兼容调试
      CORS_ALLOW_ORIGINS: "https://${DOMAIN},http://${DOMAIN}"
    volumes:
      - mediadata:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # 运行时加固：禁 setuid 提权 + 丢弃全部内核 capabilities（uvicorn 仅需监听非特权端口）
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 单机 2C4G：后端给足 1C/1G，其余服务平摊剩余资源
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    restart: unless-stopped
    networks: [kunflix_net]

  # ---------------------------------------------------------------------------
  # Worker —— arq 后台任务消费者（音乐/视频/批量图像生成）
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: kunflix-worker
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_BACKEND: redis
      QUEUE_BACKEND: arq
      QUEUE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      STORAGE_BACKEND: local
      STORAGE_LOCAL_BASE_DIR: /app/media
    command: ["arq", "tasks_queue.worker.WorkerSettings"]
    volumes:
      - mediadata:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    networks: [kunflix_net]

  # ---------------------------------------------------------------------------
  # Frontend —— Next.js (port 3666)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: kunflix-frontend
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3666/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    networks: [kunflix_net]

  # ---------------------------------------------------------------------------
  # Admin Dashboard —— Next.js (port 3888, basePath=/admin)
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    container_name: kunflix-admin
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3888/admin > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    networks: [kunflix_net]

  # ---------------------------------------------------------------------------
  # Nginx —— 反向代理 + TLS 终结 + 静态媒体直出
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: kunflix-nginx
    environment:
      # nginx 官方镜像的 envsubst 机制：将 templates/*.template 渲染到 conf.d/
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: ".template"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      # 仅替换 DOMAIN，nginx 内置变量（$host / $remote_addr 等）保留原样
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - mediadata:/var/www/media:ro
      - certbotdata:/etc/letsencrypt:ro
      - certbotwww:/var/www/certbot:ro
    depends_on:
      - frontend
      - admin
      - backend
    # Nginx 需保留 NET_BIND_SERVICE 以绑定 80/443 特权端口，其余 caps 全部丢弃
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null 2>&1 || wget -qO- --no-check-certificate https://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    networks: [kunflix_net]

  # ---------------------------------------------------------------------------
  # Certbot —— Let's Encrypt 证书签发与自动续期
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: kunflix-certbot
    volumes:
      - certbotdata:/etc/letsencrypt
      - certbotwww:/var/www/certbot
    # 每 12 小时尝试续期一次；首次签发用 scripts/init-letsencrypt.sh
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'
    restart: unless-stopped
    networks: [kunflix_net]

networks:
  kunflix_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  mediadata:
  certbotdata:
  certbotwww:
