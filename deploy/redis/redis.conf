# =============================================================================
# Redis 7 - KunFlix 生产配置（单机 2C4G，仅内网暴露）
# =============================================================================

# 网络：仅绑定容器内网，密码由 compose --requirepass 注入
# protected-mode 关闭：Redis 仅在 Docker 内网通信，不暴露端口到宿主机，
# 外部完全不可达，安全性由 Docker 网络隔离保证。
# 避免 --requirepass 命令行参数未生效时导致所有连接被拒绝。
bind 0.0.0.0 -::
protected-mode no
port 6379
timeout 0
tcp-keepalive 60

# 持久化（AOF + RDB 双保险；appendfsync everysec 平衡性能与安全）
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 10
save 60 10000

# 内存策略
maxmemory 256mb
maxmemory-policy allkeys-lru

# 数据库数量（db0=cache, db1=arq queue，详见 docker-compose.yml）
databases 16

# 客户端
tcp-backlog 511
maxclients 10000

# 日志
loglevel notice
logfile ""
