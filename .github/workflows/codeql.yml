# =============================================================================
# CodeQL - 静态安全分析
# 文档：https://docs.github.com/code-security/code-scanning
# -----------------------------------------------------------------------------
# 覆盖语言：
#   - python       (backend/)
#   - javascript-typescript (frontend/, backend/admin/)
# 触发：push / PR 到主分支，以及每周一凌晨定时扫描
# =============================================================================
name: "CodeQL"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # 每周一 03:30 UTC (北京时间 11:30) 全量扫描
    - cron: "30 3 * * 1"

# 并发：同一分支新 push 取消上一轮扫描，节省分钟数
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 启用 security-and-quality 规则集，比 default 更严
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
